services:
  postgres:
    image: postgres:17
    container_name: novaplan_pg
    environment:
      POSTGRES_USER: novaplan
      POSTGRES_PASSWORD: novaplan_local
      POSTGRES_DB: novaplan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaplan -d novaplan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
